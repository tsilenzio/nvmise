[package]
name = "nvmise"
description = "nvm's commands, with mise keeping the Node versions"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace]
members = ["xtask"]

[dependencies]
nvmimic = { git = "https://github.com/tsilenzio/nvmimic", tag = "v0.1.1" }

[dev-dependencies]
# The harness that compares a program with official nvm, case by case.
nvmimic-parity = { git = "https://github.com/tsilenzio/nvmimic", tag = "v0.1.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
